name: Refresh flight prices

# ═════════════════════════════════════════════════════════════════════════════
# Codzienne odświeżanie cen lotów z Ryanair + Wizzair.
#
# Strategia anty-bot:
#   Patchright (stealth Playwright) omija Kasada fingerprinting Wizzair.
#   Kasada wykrywa flagi automatyzacji przeglądarki — Patchright je usuwa.
#   ubuntu-latest → Patchright + patched Chromium → Wizzair: prawdziwe ceny
#
# GitHub Actions cron działa w UTC. 7:00 UTC = 8:00 CET / 9:00 CEST
# ═════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'refresh-flights.js'
      - 'generate-flights.js'
      - '.github/workflows/refresh-flights.yml'

permissions:
  contents: write

jobs:
  # ─── Job 1: self-hosted runner (prawdziwe ceny Wizzair) ──────────────────
  refresh-selfhosted:
    name: refresh (self-hosted + Playwright)
    runs-on: self-hosted
    # Uruchamia się tylko jeśli runner z etykietą "wizzair-runner" jest online
    continue-on-error: true
    timeout-minutes: 25
    if: ${{ vars.USE_SELF_HOSTED_RUNNER == 'true' }}

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🎭 Sprawdź Patchright
        run: |
          if ! node -e "require('patchright')" 2>/dev/null; then
            echo "Instaluję Patchright..."
            npm install patchright
            npx patchright install chromium
          else
            echo "✅ Patchright dostępny"
          fi

      - name: 🌐 Test API (smoke test)
        run: |
          echo "── Test Ryanair API ──"
          curl -sS -o /tmp/ry.json -w "HTTP %{http_code} | size %{size_download}B | time %{time_total}s\n" \
            "https://www.ryanair.com/api/farfnd/v4/roundTripFares?departureAirportIataCode=KRK&arrivalAirportIataCode=STN&outboundDepartureDateFrom=$(date +%Y-%m-%d)&outboundDepartureDateTo=$(date -d '+30 days' +%Y-%m-%d)&inboundDepartureDateFrom=$(date +%Y-%m-%d)&inboundDepartureDateTo=$(date -d '+33 days' +%Y-%m-%d)&durationFrom=1&durationTo=3&outboundDepartureTimeFrom=00:00&outboundDepartureTimeTo=23:59&inboundDepartureTimeFrom=00:00&inboundDepartureTimeTo=23:59&adultPaxCount=1&teenPaxCount=0&childPaxCount=0&infantPaxCount=0&searchMode=ALL&currency=PLN&market=pl-pl" \
            -H "accept: application/json" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36" \
            || echo "Ryanair: błąd połączenia"

      - name: 🔄 Pobierz ceny lotów
        run: node refresh-flights.js
        env:
          NODE_ENV: production

      - name: 📊 Statystyki
        if: always()
        run: |
          if [ -f flights.json ]; then
            echo "── flights.json ──"
            ls -lh flights.json
            node -e "
              const d = require('./flights.json');
              console.log('  Źródło:   ', d.source);
              console.log('  Łącznie:  ', d.totalCount);
              console.log('  Ryanair:  ', d.flights.filter(f=>f.airline==='ryanair').length);
              console.log('  Wizzair:  ', d.flights.filter(f=>f.airline==='wizzair').length);
              console.log('  Aktualiz: ', d.lastUpdated);
            "
          else
            echo "❌ Brak flights.json"
          fi

      - name: 🔍 Pokaż próbki API
        if: always()
        run: |
          if [ -f api-samples.json ]; then
            echo "── api-samples.json ──"
            cat api-samples.json
          fi

      - name: 📤 Upload próbek API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-samples-${{ github.run_number }}
          path: api-samples.json
          retention-days: 14
          if-no-files-found: warn

      - name: 💾 Commit i push
        run: |
          git config user.name  "Flight Bot"
          git config user.email "bot@lotynaweekend.pl"
          cp flights.json /tmp/flights_new.json
          [ -f api-samples.json ] && cp api-samples.json /tmp/api_samples_new.json || true
          git checkout -- flights.json api-samples.json 2>/dev/null || true
          git pull --rebase origin main
          cp /tmp/flights_new.json flights.json
          [ -f /tmp/api_samples_new.json ] && cp /tmp/api_samples_new.json api-samples.json || true
          git add flights.json api-samples.json
          if git diff --staged --quiet; then
            echo "ℹ️ Brak zmian — pomijam commit"
          else
            COUNT=$(node -e "console.log(require('./flights.json').totalCount)")
            SOURCE=$(node -e "console.log(require('./flights.json').source)")
            git commit -m "🔄 Aktualizacja cen ($(date -u +%Y-%m-%d) — ${COUNT} lotów — ${SOURCE})"
            git push
            echo "✅ Wypchnięto zmiany"
          fi

  # ─── Job 2: GitHub hosted runner (instalacja Playwright, Wizzair live) ───
  refresh:
    name: Refresh flight prices
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Uruchamia się gdy brak self-hosted runnera
    if: ${{ vars.USE_SELF_HOSTED_RUNNER != 'true' }}

    steps:
      - name: 📦 Checkout repozytorium
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 (z fetch API)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: |
          npm ci
          npx patchright install chromium

      - name: 🌐 Test połączenia z API (smoke test)
        run: |
          echo "── Test Ryanair API ────────────────────────────────"
          curl -sS -o /tmp/ry.json -w "HTTP %{http_code} | size %{size_download}B | time %{time_total}s\n" \
            "https://www.ryanair.com/api/farfnd/v4/roundTripFares?departureAirportIataCode=KRK&arrivalAirportIataCode=STN&outboundDepartureDateFrom=$(date +%Y-%m-%d)&outboundDepartureDateTo=$(date -d '+30 days' +%Y-%m-%d)&inboundDepartureDateFrom=$(date +%Y-%m-%d)&inboundDepartureDateTo=$(date -d '+33 days' +%Y-%m-%d)&durationFrom=1&durationTo=3&outboundDepartureTimeFrom=00:00&outboundDepartureTimeTo=23:59&inboundDepartureTimeFrom=00:00&inboundDepartureTimeTo=23:59&adultPaxCount=1&teenPaxCount=0&childPaxCount=0&infantPaxCount=0&searchMode=ALL&currency=PLN&market=pl-pl" \
            -H "accept: application/json" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
            -H "referer: https://www.ryanair.com/pl/pl/fare-finder?originIata=KRK&destinationIata=STN" \
            || echo "Ryanair: błąd połączenia"
          echo "Pierwszy fragment odpowiedzi Ryanair:"
          head -c 300 /tmp/ry.json 2>/dev/null || echo "(brak danych)"
          echo ""

          echo "── Test Wizzair (sprawdzenie homepage) ──────────────"
          curl -sS -o /dev/null -w "HTTP %{http_code} | time %{time_total}s\n" \
            "https://wizzair.com/pl-pl" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            || echo "Wizzair: błąd połączenia"

      - name: 🔄 Pobierz najnowsze ceny lotów
        id: refresh
        run: node refresh-flights.js
        env:
          NODE_ENV: production

      - name: 📊 Pokaż statystyki pliku
        if: always()
        run: |
          if [ -f flights.json ]; then
            echo "── Rozmiar i podgląd flights.json ──"
            ls -lh flights.json
            echo ""
            node -e "
              const d = require('./flights.json');
              console.log('  Źródło:   ', d.source);
              console.log('  Lotów:    ', d.totalCount);
              console.log('  Ryanair:  ', d.flights.filter(f=>f.airline==='ryanair').length);
              console.log('  Wizzair:  ', d.flights.filter(f=>f.airline==='wizzair').length);
              console.log('  Aktualiz: ', d.lastUpdated);
            "
          else
            echo "❌ Brak pliku flights.json"
          fi

      - name: 🔍 Pokaż próbki odpowiedzi API w logu
        if: always()
        run: |
          if [ -f api-samples.json ]; then
            echo "── Treść api-samples.json (pierwsze 4000 znaków) ──"
            head -c 4000 api-samples.json
            echo ""
            echo "(... pełny plik dostępny w artefaktach)"
          else
            echo "ℹ️ Brak api-samples.json — żaden request nie został zarejestrowany"
          fi

      - name: 📤 Upload próbek odpowiedzi API (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-samples-${{ github.run_number }}
          path: api-samples.json
          retention-days: 14
          if-no-files-found: warn

      - name: 💾 Commit i push (jeśli są zmiany)
        run: |
          git config user.name  "Flight Bot"
          git config user.email "bot@lotynaweekend.pl"
          # Zachowaj wygenerowane pliki, przywróć oryginały, pull, a potem wróć
          cp flights.json /tmp/flights_new.json
          [ -f api-samples.json ] && cp api-samples.json /tmp/api_samples_new.json || true
          git checkout -- flights.json api-samples.json 2>/dev/null || true
          git pull --rebase origin main
          cp /tmp/flights_new.json flights.json
          [ -f /tmp/api_samples_new.json ] && cp /tmp/api_samples_new.json api-samples.json || true
          git add flights.json api-samples.json
          if git diff --staged --quiet; then
            echo "ℹ️ Brak zmian w cenach — pomijam commit"
          else
            COUNT=$(node -e "console.log(require('./flights.json').totalCount)")
            SOURCE=$(node -e "console.log(require('./flights.json').source)")
            git commit -m "🔄 Aktualizacja cen lotów ($(date -u +%Y-%m-%d) — ${COUNT} lotów — ${SOURCE})"
            git push
            echo "✅ Wypchnięto zmiany do repo"
          fi
